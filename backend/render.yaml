services:
  - type: web
    name: quill-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false   # means "I'll set this manually in the dashboard"
    rootDir: backend